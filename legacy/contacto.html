<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Contacto — Enzo Rabossi</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <meta name="description" content="Pagina de contacto de Enzo Rabossi: desarrollador web Full Stack"/>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>

  <body>
    <div id="header"></div>

    <main class="main-content">
      
      <section class="contact-section">
        <h1 class="contact-section-title">Contacto</h1>
        <h2 class="contact-section-description">Rellena el formulario y me pondré en contacto contigo</h2>
        <div class="contact-form">
          <form action="https://formsubmit.co/enzorabossi@gmail.com" method="POST">
            <input type="hidden" name="_subject" value="Nuevo mensaje desde CV Portfolio">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            <div>
              <label for="name">Nombre</label>
              <input 
              type="text" 
              id="name" 
              placeholder="Enzo" 
              name="name"
              required />
            </div>
            <div>
              <label for="email">Email</label>
              <input
                type="email"
                id="email"
                placeholder="enzo@gmail.com"
                name="email"
                required
              />
            </div>
            <div>
              <label for="asunto">Asunto</label>
              <input
                type="text"
                id="asunto"
                placeholder="Asunto del mensaje"
                name="asunto"
                required
              />
            </div>
            <div>
              <label for="mensaje">Mensaje</label>
              <textarea                  
                name="mensaje"
                id="mensaje"
                cols="30"
                rows="10"
                placeholder="Escribe tu mensaje..."
                required
              ></textarea>
            </div>
            <div>
              <input type="submit" value="Enviar" />
            </div>
          </form>
        </div>
      </section>
    </main>

    <div id="footer"></div>
  </body>
</html>
